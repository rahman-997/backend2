name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: eventify
          POSTGRES_USER: eventify
          POSTGRES_PASSWORD: eventify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventify -d eventify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://eventify:eventify@localhost:5432/eventify
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-eventify-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      WEB_ORIGIN: http://localhost:5173
      AUTH_RATE_LIMIT_MAX: 10000
      EMAIL_MODE: log

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install API dependencies
        run: npm install --no-audit --no-fund

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Seed integration fixtures
        run: npm run db:seed

      - name: Verify API, architecture and tests
        run: npm run verify

      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Frontend dependency audit
        working-directory: web
        run: npm audit --audit-level=high
