name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: backend2
          POSTGRES_USER: backend2
          POSTGRES_PASSWORD: backend2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backend2 -d backend2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: backend2
          MYSQL_USER: backend2
          MYSQL_PASSWORD: backend2
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u backend2 -pbackend2 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

    env:
      DATABASE_URL: postgresql://backend2:backend2@localhost:5432/backend2
      MYSQL_URL: mysql://backend2:backend2@localhost:3306/backend2
      STORAGE: postgres
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:3000
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 1000

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify Node.js
        run: node --version && npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run PostgreSQL migrations
        run: STORAGE=postgres npm run db:migrate

      - name: Validate PostgreSQL database contract
        run: npm run db:contract

      - name: Validate Prisma schema
        run: npm run db:prisma:validate

      - name: Generate Prisma client
        run: npm run db:prisma:generate

      - name: Check Drizzle schema
        run: npm run db:drizzle:check

      - name: Validate TypeORM schema
        run: npm run db:typeorm:validate

      - name: Cross ORM compatibility smoke test
        run: npm run db:orm:smoke

      - name: Run MySQL migrations
        run: STORAGE=mysql npm run db:migrate

      - name: Validate MySQL database contract
        run: npm run db:contract:mysql

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Run PostgreSQL compiled API end-to-end smoke test
        run: STORAGE=postgres E2E_PORT=3100 npm run test:e2e

      - name: Run MySQL compiled API end-to-end smoke test
        run: STORAGE=mysql E2E_PORT=3101 npm run test:e2e

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Docker build
        run: docker build -t backend2:ci .

      - name: Docker PostgreSQL runtime smoke test
        run: |
          container_id=$(docker run -d --network host \
            -e NODE_ENV=production \
            -e PORT=3200 \
            -e HOST=0.0.0.0 \
            -e STORAGE=postgres \
            -e DATABASE_URL=postgresql://backend2:backend2@127.0.0.1:5432/backend2 \
            -e CORS_ORIGIN=http://localhost:3000 \
            -e RATE_LIMIT_WINDOW_MS=60000 \
            -e RATE_LIMIT_MAX=1000 \
            backend2:ci)

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3200/ready; then
              docker rm -f "$container_id" >/dev/null
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_id"
          docker rm -f "$container_id" >/dev/null
          exit 1

      - name: Docker MySQL runtime smoke test
        run: |
          container_id=$(docker run -d --network host \
            -e NODE_ENV=production \
            -e PORT=3201 \
            -e HOST=0.0.0.0 \
            -e STORAGE=mysql \
            -e MYSQL_URL=mysql://backend2:backend2@127.0.0.1:3306/backend2 \
            -e CORS_ORIGIN=http://localhost:3000 \
            -e RATE_LIMIT_WINDOW_MS=60000 \
            -e RATE_LIMIT_MAX=1000 \
            backend2:ci)

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3201/ready; then
              docker rm -f "$container_id" >/dev/null
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_id"
          docker rm -f "$container_id" >/dev/null
          exit 1
