name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: backend2
          POSTGRES_USER: backend2
          POSTGRES_PASSWORD: backend2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backend2 -d backend2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://backend2:backend2@localhost:5432/backend2
      STORAGE: postgres
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:3000
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify Node.js
        run: node --version && npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run database migrations
        run: npm run db:migrate

      - name: Validate Prisma schema
        run: npm run db:prisma:validate

      - name: Generate Prisma client
        run: npm run db:prisma:generate

      - name: Check Drizzle schema
        run: npm run db:drizzle:check

      - name: Validate TypeORM schema
        run: npm run db:typeorm:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Docker build
        run: docker build -t backend2:ci .
