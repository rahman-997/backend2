services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: backend2
      POSTGRES_USER: backend2
      POSTGRES_PASSWORD: backend2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend2 -d backend2"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: backend2
      MYSQL_USER: backend2
      MYSQL_PASSWORD: backend2
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema/mysql/001_create_venues.sql:/docker-entrypoint-initdb.d/001_create_venues.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u backend2 -pbackend2 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      CORS_ORIGIN: "*"
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
      STORAGE: postgres
      DATABASE_URL: postgresql://backend2:backend2@db:5432/backend2
    depends_on:
      db:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_data:
