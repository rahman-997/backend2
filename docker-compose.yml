name: eventify

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: eventify
      POSTGRES_PASSWORD: eventify
      POSTGRES_DB: eventify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./session-3-sandbox-seed.sql:/docker-entrypoint-initdb.d/10-sandbox-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventify -d eventify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
